name: baseplate

services:
  postgres:
    image: postgres:17-alpine
    container_name: baseplate-postgres
    restart: "no"
    environment:
      POSTGRES_DB: baseplate
      POSTGRES_USER: baseplate
      POSTGRES_PASSWORD: baseplate
    ports:
      - "5050:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: baseplate-redis
    restart: "no"
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest
    container_name: baseplate-minio
    restart: "no"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: baseplate
      MINIO_ROOT_PASSWORD: baseplate-minio-password
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:5000,http://localhost:5173
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  redis_data:
  minio_data:
